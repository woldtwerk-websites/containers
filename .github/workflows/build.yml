name: Build containers

on:
  # Builds without pushing, so Renovate automerges base image updates only when
  # the image still builds.
  pull_request:
  # A merged base image update reaches the registry right away, not with the
  # nightly build.
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - frankenphp-drupal
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: |
          podman build \
            --pull=always \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --tag "$IMAGE:latest" \
            --file "${{ matrix.image }}/Containerfile" \
            "${{ matrix.image }}"

      - name: Push
        if: github.event_name != 'pull_request'
        run: podman push "$IMAGE:latest"
